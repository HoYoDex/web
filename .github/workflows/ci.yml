name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Cache the ingested wiki content between runs so CI does not refetch
      # ~2,000 pages every time. The loader only refetches changed revisions.
      - uses: actions/cache@v4
        with:
          path: web/.astro
          key: wiki-content-${{ github.run_id }}
          restore-keys: wiki-content-

      - run: pnpm build

      - run: pnpm exec tsc --noEmit
        working-directory: web
        continue-on-error: true
