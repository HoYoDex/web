name: Feature request
description: Suggest something new
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the problem, not only the solution you have in mind.
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations: { required: true }
